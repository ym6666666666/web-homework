<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图形交互效果</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff5e62'/%3E%3Ccircle cx='32' cy='32' r='18' fill='white'/%3E%3C/svg%3E">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1d1b1a;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }
        .stage{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 48px;
            padding: 56px 32px;
            max-width: 1200px;
        }
        /* ===== 所有形状的公共样式 ===== */
        .shape{
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 关键：写在普通状态，悬浮才有平滑过渡 */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        /* 悬浮时：上移10px + 阴影偏移量归0 */
        .shape:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 0 rgba(0,0,0,0);
        }
        /* 形状中间的 hover 字样 */
        .shape span{
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-shadow: 0 1px 3px rgba(0,0,0,0.35);
        }
        .shape:hover span{
            opacity: 1;
        }

        /* ===== 六个图形：形状与颜色对齐上课案例 ===== */

        /* 1. 直角正方形（橙红渐变） */
        .s1{
            border-radius: 0;
            background: linear-gradient(135deg,#ff9a56,#ff5e62);
            box-shadow: 8px 12px 24px rgba(255,94,98,0.4);
        }
        /* 2. 圆角正方形（青绿渐变） */
        .s2{
            border-radius: 20px;
            background: linear-gradient(135deg,#11998e,#38ef7d);
            box-shadow: 8px 12px 24px rgba(17,153,142,0.4);
        }
        /* 3. 圆角正方形（淡紫渐变） */
        .s3{
            border-radius: 20px;
            background: linear-gradient(135deg,#a18cd1,#c8b6e8);
            box-shadow: 8px 12px 24px rgba(161,140,209,0.4);
        }
        /* 4. 圆形（暖黄→橙渐变） */
        .s4{
            border-radius: 50%;
            background: linear-gradient(135deg,#f6d365,#fda085);
            box-shadow: 8px 12px 24px rgba(246,211,101,0.4);
        }
        /* 5. 圆角正方形（绿→蓝渐变） */
        .s5{
            border-radius: 20px;
            background: linear-gradient(135deg,#43cea2,#2f80ed);
            box-shadow: 8px 12px 24px rgba(67,206,162,0.4);
        }
        /* 6. 圆形（淡紫渐变） */
        .s6{
            border-radius: 50%;
            background: linear-gradient(135deg,#e0c3fc,#b18cd1);
            box-shadow: 8px 12px 24px rgba(176,140,209,0.4);
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="shape s1"><span>hover</span></div>
        <div class="shape s2"><span>hover</span></div>
        <div class="shape s3"><span>hover</span></div>
        <div class="shape s4"><span>hover</span></div>
        <div class="shape s5"><span>hover</span></div>
        <div class="shape s6"><span>hover</span></div>
    </div>
</body>
</html>
