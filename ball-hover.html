<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆球悬浮效果</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1d1b1a;
        }
        .stage{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 56px;
            padding:56px 32px
        }
        .cube{
            width: 170px;
            height: 170px;
            transition: transform 0.3s ease;
        }
        .c1{
            border-radius: 50%;
            background: linear-gradient(135deg,#ff9a56,#ff5e62);
            box-shadow: 0 10px 24px rgba(255, 94, 98, .35);
        }
        .c2{
            border-radius: 50%;
            background: linear-gradient(135deg,#4facfe,#00f2fe);
            box-shadow: 0 10px 24px rgba(79, 172, 254, .35);
        }
        .c3{
            border-radius: 50%;
            background: linear-gradient(135deg,#43e97b,#38f9d7);
            box-shadow: 0 10px 24px rgba(67, 233, 123, .35);
        }
        .c4{
            border-radius: 50%;
            background: linear-gradient(135deg,#fa709a,#fee140);
            box-shadow: 0 10px 24px rgba(250, 112, 154, .35);
        }
        .c5{
            border-radius: 50%;
            background: linear-gradient(135deg,#a18cd1,#fbc2eb);
            box-shadow: 0 10px 24px rgba(161, 140, 209, .35);
        }
        .c6{
            border-radius: 50%;
            background: linear-gradient(135deg,#ffecd2,#fcb69f);
            box-shadow: 0 10px 24px rgba(252, 182, 159, .35);
        }
        .cube:hover{
            transform: translateY(-10px);
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="cube c1"></div>
        <div class="cube c2"></div>
        <div class="cube c3"></div>
        <div class="cube c4"></div>
        <div class="cube c5"></div>
        <div class="cube c6"></div>
    </div>
</body>
</html>
